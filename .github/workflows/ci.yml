# The quality gate: type-check, test and build on every push and every pull request.
#
# **Deployment is not here, and that is deliberate.** This app is server-rendered — `next start`, not a
# folder of HTML — so it needs a host that runs Node, and the host's own git integration is what
# deploys it. A workflow that also pushed the build would be a second deploy racing the first.
#
# What this job is for is the thing a git integration does *not* do: fail the commit. A host builds and
# publishes whatever it is given, so without this a screen that throws on mount, or a type error the
# build tolerates, reaches nextjs.viliha.com and is noticed by a visitor.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same branch is wasted compute; a superseded run on `main` is a green tick on
# a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is committed, and a check that resolves its own
      # dependency versions is a check that can pass on a tree nobody will ever deploy.
      - run: npm ci

      - run: npm run check-types

      - run: npm test

      # Last, because it is the slowest and the two above catch most of what it would.
      - run: npm run build
        env:
          # Not secret — `NEXT_PUBLIC_*` is inlined into the browser bundle by definition. Set here so
          # the build exercises the configured path rather than only the fallbacks in `footer.tsx`.
          NEXT_PUBLIC_SITE_NAME: VILIHA
          NEXT_PUBLIC_SITE_URL: https://viliha.com
